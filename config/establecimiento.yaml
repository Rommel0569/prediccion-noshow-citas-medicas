# Información que el bot puede dar a los pacientes. Complete con los datos reales del establecimiento.
# Lo que quede vacío se responde con "comuníquese con admisión".
nombre: "Consulta externa"
horario: "Lunes a viernes de 7:30 a 18:00"
direccion: ""          # Ej.: "Av. Ejemplo 123, Distrito, Arequipa"
documentos: "DNI y, si tiene, su carnet de seguro (SIS o EsSalud)"
telefono: ""           # Teléfono de admisión
costo: ""              # Ej.: "Los asegurados al SIS no pagan; consulte la tarifa en admisión"
servicios:             # especialidades disponibles al agendar una cita
  - Medicina General
  - Pediatría
  - Ginecología
  - Cardiología
  - Neurología
  - Traumatología
  - Dermatología
  - Oftalmología
  - Endocrinología
  - Gastroenterología
  - Neumología
  - Psiquiatría

# Llamada con mensaje hablado (cuenta de prueba de Twilio: el mensaje se publica como archivo; ver generar_llamada.py)
llamada:
  voz: "Polly.Mia"        # voz de Twilio (Amazon Polly). Español: Polly.Mia (México), Polly.Andres-Neural (México, hombre), Polly.Lupe (EE. UU.), Polly.Lucia (España)
  idioma: "es-MX"
  frases:                 # cada frase se dice por separado, con una pausa
    - "Hola, le llamamos de {establecimiento}."
    - "Le recordamos que tiene una cita médica próxima."
    - "Si no podrá asistir, comuníquese con admisión para liberar su cupo a otro paciente."
    - "Gracias, que tenga un buen día."
